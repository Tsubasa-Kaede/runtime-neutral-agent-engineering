# TestPyPI Trusted Publishing drill (RELEASE-PYPI-6 design, RELEASE-PYPI-7 implementation).
#
# Hard rules baked into this workflow:
# - Trigger is workflow_dispatch ONLY: no pushed tag can ever start it, so it can
#   never collide with the production publish.yml (which listens on v[0-9]* tags).
# - Publishes ONLY to TestPyPI (repository-url below is explicit); the production
#   PyPI endpoint is never referenced here.
# - Requires an explicit confirmation input (confirm-testpypi-upload == true);
#   anything else skips the publish job outright, and an in-job gate fails hard
#   as a second layer — no upload path exists without the confirmation.
# - Requires the GitHub Environment "testpypi" (never "pypi") and the TestPyPI
#   pending publisher registered for THIS file + that environment; both are
#   configured on the GitHub/TestPyPI side, never by this file alone.
# - Trusted Publishing / OIDC only: NO API token, NO PYPI_TOKEN secret, NO
#   passwords, NO ~/.pypirc — nothing long-lived is stored anywhere.
# - Build and publish are separate jobs: the publish job uploads the exact
#   artifact built by the build job (single, traceable source of truth) and
#   never rebuilds.
# - No runtime is installed, invoked, or logged in; no credentials are read.

name: Publish to TestPyPI

on:
  workflow_dispatch:
    inputs:
      confirm-testpypi-upload:
        description: 'Explicit confirmation: must be true for the publish job to upload to TestPyPI.'
        type: boolean
        required: true
        default: false
      expected-version:
        description: 'Version the build must carry (must equal pyproject.toml and dual_agent.__version__).'
        type: string
        required: false
        default: '2.1.0'

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel (dispatch ${{ github.ref_name }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ref
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Version consistency gate (pyproject == dual_agent == expected)
        env:
          EXPECTED_VERSION: ${{ inputs.expected-version }}
        run: |
          python - <<'PY'
          import os, pathlib, re, sys, tomllib

          expected = os.environ.get("EXPECTED_VERSION", "").strip()
          if not expected:
              sys.exit("expected-version input is empty; refusing to build")

          pyproject = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          name, declared = pyproject["project"]["name"], pyproject["project"]["version"]

          # Read the shipped constant directly: importing the mapped package
          # from the source tree is ambiguous (scripts/ holds a legacy
          # top-level dual_agent.py module without __version__).
          init_text = pathlib.Path("dual-agent-development/scripts/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'__version__\s*=\s*"([^"]+)"', init_text)
          if match is None:
              sys.exit("dual_agent __version__ constant not found")
          pkg_version = match.group(1)

          if declared != expected or pkg_version != expected:
              sys.exit(
                  f"version mismatch: expected={expected} pyproject={declared} "
                  f"dual_agent.__version__={pkg_version}"
              )
          print(f"version gate OK: {name} {declared} (TestPyPI drill build)")
          PY

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to TestPyPI (Trusted Publishing, OIDC only)
    needs: build
    # Confirmation gate, layer 1: with confirm-testpypi-upload == false the job
    # is skipped entirely (no environment request, no upload of any kind).
    if: ${{ inputs.confirm-testpypi-upload == true }}
    runs-on: ubuntu-latest
    # Requires the GitHub Environment "testpypi" (never "pypi") and a matching
    # TestPyPI pending publisher:
    #   owner: Tsubasa-Kaede  repository: runtime-neutral-agent-engineering
    #   workflow: publish-testpypi.yml  environment: testpypi
    environment: testpypi
    permissions:
      id-token: write   # OIDC token for TestPyPI Trusted Publishing — this job only
      contents: read
    steps:
      # Confirmation gate, layer 2: belt-and-suspenders refusal that fails hard
      # if the job-level `if` above is ever removed or weakened.
      - name: Confirmation gate (refuse unless explicitly confirmed)
        run: |
          if [ "${{ inputs.confirm-testpypi-upload }}" != "true" ]; then
            echo "confirm-testpypi-upload is not true — refusing to publish to TestPyPI."
            exit 1
          fi

      - name: Download dist artifact from the build job
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI with provenance attestations (no API token)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/
          attestations: true
