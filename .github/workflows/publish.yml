# PyPI Trusted Publishing chain (Phase RELEASE-PYPI-2).
#
# Hard rules baked into this workflow:
# - Publishes ONLY on a pushed version tag (vX.Y.Z...). Branch pushes and
#   pull requests can never publish; forks can never publish (no PR trigger).
# - Version consistency gate: the tag MUST equal the
#   dual_agent.__version__ constant (the distribution's single version
#   truth), and the pyproject dynamic-version wiring must point at that
#   same constant, or the run fails before building. The gate is
#   scripts/version_gate.py — the single, tested implementation
#   (tests/test_version_gate.py) shared with publish-testpypi.yml.
# - Trusted Publishing / OIDC only: NO PyPI API token, NO PYPI_TOKEN secret,
#   NO passwords, NO ~/.pypirc — nothing long-lived is stored anywhere.
# - Build, publish, and release are separate jobs: the publish job uploads
#   the exact artifact built by the build job (single, traceable source of
#   truth); the release job turns the same tag into a GitHub Release with
#   the artifacts attached, after PyPI publish succeeds.
# - Install-state gate (CU 2.4.2-D): before the dist artifact is uploaded,
#   the build job installs the built wheel into a fresh venv (offline,
#   --no-index --find-links dist) and runs scripts/verify_installed.py
#   from a neutral cwd — the same single tested implementation the ci.yml
#   install-smoke job uses. A gate failure fails the build job before the
#   upload, so an unverified wheel can never be published or released.
# - The publish job requires the GitHub Environment "pypi" and a matching
#   PyPI pending publisher; both are configured on the GitHub/PyPI side,
#   never by this file alone.
# - No runtime is installed, invoked, or logged in; no credentials are read.

name: Publish

on:
  push:
    tags:
      - 'v[0-9]*'   # candidate version tags only; the gate below enforces strict vX.Y.Z form

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel (tag ${{ github.ref_name }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Version consistency gate (tag == dual_agent.__version__, dynamic wiring)
        # scripts/version_gate.py resolves the version source from pyproject's
        # own package-dir / dynamic.attr mapping and imports it from this
        # checkout by explicit path — pyproject [project] carries no literal
        # version (dynamic = ["version"]), and [project]["version"] is never read.
        run: python scripts/version_gate.py --tag "${GITHUB_REF_NAME:-}"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Wheel install-state gate (fresh venv, offline)
        # CU 2.4.2-D: verifies the exact bytes headed for upload — the same
        # recipe as the ci.yml install-smoke job (fresh venv, --no-index
        # install from this dist/, neutral cwd, scripts/verify_installed.py;
        # no second implementation, no second build). A failure here fails
        # the build job BEFORE the artifact upload.
        run: |
          python -m venv "$RUNNER_TEMP/release-smoke-venv"
          "$RUNNER_TEMP/release-smoke-venv/bin/python" -m pip install --no-index --find-links dist dual_agent_development
          cd "$RUNNER_TEMP" && "$RUNNER_TEMP/release-smoke-venv/bin/python" "$GITHUB_WORKSPACE/scripts/verify_installed.py"

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI (Trusted Publishing, OIDC only)
    needs: build
    runs-on: ubuntu-latest
    # Requires the GitHub Environment "pypi" (created on the GitHub side)
    # and a matching PyPI pending publisher:
    #   owner: Tsubasa-Kaede  repository: runtime-neutral-agent-engineering
    #   workflow: publish.yml  environment: pypi
    environment: pypi
    permissions:
      id-token: write   # OIDC token for PyPI Trusted Publishing — this job only
      contents: read
    steps:
      - name: Download dist artifact from the build job
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish with provenance attestations (no API token)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          attestations: true

  release:
    name: GitHub Release (artifacts + generated notes)
    needs: publish   # a GitHub Release only appears after the PyPI publish succeeded
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release for the pushed tag — this job only
    steps:
      - name: Download dist artifact from the build job
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release with the built artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
