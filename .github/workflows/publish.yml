# PyPI Trusted Publishing chain (Phase RELEASE-PYPI-2).
#
# Hard rules baked into this workflow:
# - Publishes ONLY on a pushed version tag (vX.Y.Z...). Branch pushes and
#   pull requests can never publish; forks can never publish (no PR trigger).
# - Version consistency gate: the tag MUST equal the pyproject version and
#   the dual_agent.__version__ constant, or the run fails before building.
# - Trusted Publishing / OIDC only: NO PyPI API token, NO PYPI_TOKEN secret,
#   NO passwords, NO ~/.pypirc — nothing long-lived is stored anywhere.
# - Build and publish are separate jobs: the publish job uploads the exact
#   artifact built by the build job (single, traceable source of truth).
# - The publish job requires the GitHub Environment "pypi" and a matching
#   PyPI pending publisher; both are configured on the GitHub/PyPI side,
#   never by this file alone.
# - No runtime is installed, invoked, or logged in; no credentials are read.

name: Publish

on:
  push:
    tags:
      - 'v[0-9]*'   # candidate version tags only; the gate below enforces strict vX.Y.Z form

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel (tag ${{ github.ref_name }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Version consistency gate (tag == pyproject == dual_agent)
        run: |
          python - <<'PY'
          import os, pathlib, re, sys, tomllib

          tag = os.environ.get("GITHUB_REF_NAME", "")
          if not re.fullmatch(r"v\d+\.\d+\.\d+([-a-zA-Z0-9.]+)?", tag):
              sys.exit(f"tag {tag!r} is not a strict vX.Y.Z[pre] tag; refusing to build")

          pyproject = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          name, declared = pyproject["project"]["name"], pyproject["project"]["version"]

          # Read the shipped constant directly: importing the mapped package
          # from the source tree is ambiguous (scripts/ holds a legacy
          # top-level dual_agent.py module without __version__).
          init_text = pathlib.Path("dual-agent-development/scripts/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'__version__\s*=\s*"([^"]+)"', init_text)
          if match is None:
              sys.exit("dual_agent __version__ constant not found")
          pkg_version = match.group(1)

          tag_version = tag[1:]
          if declared != tag_version or pkg_version != tag_version:
              sys.exit(
                  f"version mismatch: tag={tag_version} pyproject={declared} "
                  f"dual_agent.__version__={pkg_version}"
              )
          print(f"version gate OK: {name} {tag_version}")
          PY

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI (Trusted Publishing, OIDC only)
    needs: build
    runs-on: ubuntu-latest
    # Requires the GitHub Environment "pypi" (created on the GitHub side)
    # and a matching PyPI pending publisher:
    #   owner: Tsubasa-Kaede  repository: runtime-neutral-agent-engineering
    #   workflow: publish.yml  environment: pypi
    environment: pypi
    permissions:
      id-token: write   # OIDC token for PyPI Trusted Publishing — this job only
      contents: read
    steps:
      - name: Download dist artifact from the build job
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish with provenance attestations (no API token)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          attestations: true
