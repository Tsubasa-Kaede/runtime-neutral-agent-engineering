[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dual-agent-development"
# P1-U4 §5: single version truth lives in dual_agent.__version__
# (dual-agent-development/scripts/__init__.py); the distribution reads it
# dynamically so the two numbers can never drift apart.
dynamic = ["version"]
description = "Runtime-neutral dual-agent collaboration orchestrator: architect, coder, tester, reviewer with structured packets and an append-only ledger."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "DSWD", email = "andi1888252@gmail.com" },
]
maintainers = [
  { name = "DSWD", email = "andi1888252@gmail.com" },
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "tomli>=2; python_version < '3.11'",
]

[project.scripts]
# host_entry.main is the default host composition root (P1-U1): it wires
# environment discovery -> bootstrap -> facade and injects the result into
# the unchanged cli.main; cli.main itself never constructs runtimes,
# adapters, or credentials.
dual-agent = "dual_agent.host_entry:main"

[tool.setuptools]
packages = ["dual_agent"]

[tool.setuptools.package-dir]
dual_agent = "dual-agent-development/scripts"

[tool.setuptools.dynamic]
version = { attr = "dual_agent.__version__" }

[tool.setuptools.data-files]
"share/dual-agent/skill" = ["dual-agent-development/SKILL.md"]
"share/dual-agent/skill/references" = [
  "dual-agent-development/references/workflow.md",
  "dual-agent-development/references/adapter-contract.md",
]
"share/dual-agent/skill/templates" = [
  "dual-agent-development/templates/architecture-packet.json",
  "dual-agent-development/templates/implementation-packet.json",
  "dual-agent-development/templates/test-packet.json",
  "dual-agent-development/templates/review-packet.json",
]
"share/dual-agent/skill/agents" = [
  "dual-agent-development/agents/architect.md",
  "dual-agent-development/agents/coder.md",
  "dual-agent-development/agents/tester.md",
  "dual-agent-development/agents/reviewer.md",
  "dual-agent-development/agents/openai.yaml",
]
"share/dual-agent/examples" = ["examples/offline_mock_run.py"]
